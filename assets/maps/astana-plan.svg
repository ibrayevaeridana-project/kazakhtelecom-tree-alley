<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Схема будущей Аллеи Казахтелекома в Астане</title>
  <desc id="desc">Локальный генеральный план с зонами посадки деревьев, пешеходными дорожками и городской привязкой.</desc>
