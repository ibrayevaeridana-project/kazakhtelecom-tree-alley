      <stop offset="0" stop-color="#e8f6df"/>
      <stop offset="0.56" stop-color="#cfecc5"/>
      <stop offset="1" stop-color="#b7dfb3"/>
    </linearGradient>
    <linearGradient id="water" x1="0" x2="1">
      <stop offset="0" stop-color="#b7e7ef"/>
      <stop offset="1" stop-color="#73c8d9"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f3b2e" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="42" fill="#f6fbf3"/>
